version: '3.8'

services:
  article_db:
    container_name: article_service_db
    image: postgres:${POSTGRES_VERSION:-17.4}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - article_postgres_data:/var/lib/postgresql/data
    networks:               
      - app-network
    ports:
      - "5432:5432"

  article_app:
    container_name: auth_service_app
    image: ${DOCKER_USERNAME}/go-angular-backend:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
      TELEGRAM_USER_BOT_USERNAME: ${TELEGRAM_USER_BOT_USERNAME}
      INTERNAL_NOTIFICATIONS_API_KEY: ${INTERNAL_NOTIFICATIONS_API_KEY}
      TELEGRAM_LINK_TOKEN_TTL: ${TELEGRAM_LINK_TOKEN_TTL:-15m}
      
      APP_ENV: ${APP_ENV}
    depends_on:
      - article_db
    networks:               
      - app-network
    expose:
      - "8080"

  habits_db:
    container_name: habits_service_db
    image: postgres:${POSTGRES_VERSION:-17.4}
    environment:
      POSTGRES_USER: ${HABITS_DB_USER}
      POSTGRES_PASSWORD: ${HABITS_DB_PASSWORD}
      POSTGRES_DB: ${HABITS_DB_NAME}
    restart: unless-stopped
    ports:              
      - "5433:5432"
    networks:               
      - app-network
    volumes:
      - habits_postgres_data:/var/lib/postgresql/data

  n8n_db:
    container_name: n8n_db
    image: postgres:${POSTGRES_VERSION:-17.4}
    environment:
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME}
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: habits_redis
    restart: unless-stopped
    networks:
      - app-network

  nest_satellite:
    container_name: nest_satellite
    image: ${DOCKER_USERNAME}/nest-satellite:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET_KEY: ${HABITS_JWT_SECRET}
      INTERNAL_NOTIFICATIONS_API_KEY: ${INTERNAL_NOTIFICATIONS_API_KEY}
      HABITS_API_BASE_URL: ${HABITS_API_BASE_URL:-http://habits_api:8080}
      N8N_GATEWAY_WEBHOOK_URL: ${N8N_GATEWAY_WEBHOOK_URL:-http://n8n:5678/webhook/gateway/events}
      N8N_GATEWAY_SECRET: ${N8N_GATEWAY_SECRET}
      HABITS_APP_PUBLIC_URL: ${HABITS_APP_PUBLIC_URL:-}
    depends_on:
      - redis
    networks:
      - app-network
    expose:
      - "3001"

  habits_api:
    container_name: habits_api
    image: ${DOCKER_USERNAME}/habits-api:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVER_HOST: ${HABITS_SERVER_HOST}
      SERVER_PORT: ${HABITS_SERVER_PORT}
      DB_HOST: ${HABITS_DB_HOST}
      DB_PORT: ${HABITS_DB_PORT}
      DB_USER: ${HABITS_DB_USER}
      DB_PASSWORD: ${HABITS_DB_PASSWORD}
      DB_NAME: ${HABITS_DB_NAME}
      LOGS_DIR: ${HABITS_LOGS_DIR}
      JWT_SECRET_KEY: ${HABITS_JWT_SECRET}
      JWT_EXPIRATION: ${HABITS_JWT_EXPIRATION:-1h}
      REFRESH_EXPIRATION: ${HABITS_REFRESH_EXPIRATION:-720h}
      COOKIE_DOMAIN: ${HABITS_COOKIE_DOMAIN}
      SECURE_COOKIES: ${HABITS_SECURE_COOKIES}
      APP_ENV: ${APP_ENV}
      # Email verification
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      REGISTRATION_TOKEN_LIFETIME: ${REGISTRATION_TOKEN_LIFETIME:-24h}
      VERIFICATION_BASE_URL: ${VERIFICATION_BASE_URL:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPLOADS_DIR: /app/uploads
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
      TELEGRAM_USER_BOT_USERNAME: ${TELEGRAM_USER_BOT_USERNAME}
      INTERNAL_NOTIFICATIONS_API_KEY: ${INTERNAL_NOTIFICATIONS_API_KEY}
      TELEGRAM_LINK_TOKEN_TTL: ${TELEGRAM_LINK_TOKEN_TTL:-15m}
    depends_on:
      - habits_db
      - redis
    networks:               
      - app-network
    volumes:
      - habits_uploads_data:/app/uploads
    expose:
      - "8080"

  habits_frontend:
    container_name: habits_frontend
    image: ${DOCKER_USERNAME}/habits-client:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${APP_ENV:-development}
      - VITE_API_URL=/api
    networks:               
      - app-network
    expose:
      - "80"

  article_frontend:
    container_name: article_frontend
    image: ${DOCKER_USERNAME}/go-angular-frontend:latest
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=${APP_ENV:-development}
      - API_URL=/auth
    networks:               
      - app-network
    expose:
      - "80"

  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678" 
    environment:
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${N8N_DB_HOST:-n8n_db}
      DB_POSTGRESDB_PORT: ${N8N_DB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Уровень логов n8n: debug — видно входящие запросы; в проде можно N8N_LOG_LEVEL=info в .env
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-debug}
      INTERNAL_NOTIFICATIONS_API_KEY: ${INTERNAL_NOTIFICATIONS_API_KEY}
      N8N_INTERNAL_NOTIFICATIONS_URL: ${N8N_INTERNAL_NOTIFICATIONS_URL:-http://nest_satellite:3001/internal/notifications/send}
      # Полный URL: только Nest (n8n не вызывает Go напрямую).
      TELEGRAM_LINK_CONFIRM_URL: ${TELEGRAM_LINK_CONFIRM_URL:-http://nest_satellite:3001/internal/integrations/telegram/confirm}
      TELEGRAM_USER_BOT_TOKEN: ${TELEGRAM_USER_BOT_TOKEN}
      TELEGRAM_USER_BOT_USERNAME: ${TELEGRAM_USER_BOT_USERNAME}
      TELEGRAM_USER_CHAT_ID: ${TELEGRAM_USER_CHAT_ID}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n_db
    networks:
      - app-network
    expose:
      - "5678"

  nginx:
    image: nginx:alpine
    container_name: main_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - article_app
      - habits_api
      - nest_satellite
      - article_frontend
      - habits_frontend
      - n8n
    restart: unless-stopped
    networks:               
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  article_postgres_data:
    name: article_postgres_data
  habits_postgres_data:
    name: deployment_habits_postgres_data
  habits_uploads_data:
    name: deployment_habits_uploads_data
  n8n_postgres_data:
    name: deployment_n8n_postgres_data
  n8n_data:
    name: deployment_n8n_data
